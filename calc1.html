<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calc1</title>
    <link rel="stylesheet" href="calc1.css">
</head>
<body>
    <div id="calculator" >
        <input id="display"  placeholder="0">
        <div id="keys">
            
            <button onclick="appendItem('9')">9</button>
            <button onclick="appendItem('8')">8</button>
            <button onclick="appendItem('7')">7</button>
            <button onclick="appendItem('+')">+</button>            
            <button onclick="appendItem('6')">6</button>
            <button onclick="appendItem('5')">5</button>
            <button onclick="appendItem('4')">4</button>
            <button onclick="appendItem('-')">-</button>            
            <button onclick="appendItem('3')">3</button>
            <button onclick="appendItem('2')">2</button>
            <button onclick="appendItem('1')">1</button>
            <button onclick="appendItem('*')">*</button>                      
            <button onclick="appendItem('0')">0</button>
            <button onclick="appendItem('.')">.</button>
             <button onclick="appendItem('22/7')">PI</button>  
            <button onclick="appendItem('/')">/</button>        
             <button onclick="clearDisplay()">C</button>
             <div></div>  <div></div>   
            <button  class="js-calculate equal-button" >=</button> 
            
            
        </div>
    </div>
    <script src="calc1.js"></script>
</body>
</html>
